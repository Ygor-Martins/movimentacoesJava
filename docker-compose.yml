version: '3.8'

services:
  app:
    build: .
    container_name: financeiro-app
    ports: 
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financeiro
      DB_USER: postgres
      DB_PASS: 290699
  postgres:
    image: postgres:18
    container_name: postgres-finance
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 290699
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: